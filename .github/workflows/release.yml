name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # Tag v1.0.0 builds version 1.0.0. "build" runs the tests first, so a
      # failing build blocks the release.
      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew build -PreleaseVersion="${GITHUB_REF_NAME#v}"

      - name: Create release with the JAR
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
